<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPSULE - My Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#C7A07A">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #f5ede0;
            --surface:   #fffdf8;
            --border:    #e8c99a;
            --brown:     #4a3220;
            --brown-mid: #8b6b4f;
            --brown-lt:  #b89878;
            --gold:      #c8a46b;
            --red:       #b84a4a;
            --green:     #4a8b5f;
            --shadow:    rgba(74,50,32,0.10);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: 'Poppins', sans-serif; color: var(--brown); min-height: 100vh; }

        /* ── NAVBAR ── */
        .navbar {
            background: var(--surface);
            border-bottom: 1.5px solid var(--border);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px var(--shadow);
        }
        .navbar-logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            flex-shrink: 0;
        }
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-email {
            font-size: 12px;
            color: var(--brown-lt);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }
        .btn-nav {
            padding: 7px 14px;
            border-radius: 20px;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-seal   { background: var(--brown); color: white; }
        .btn-seal:hover { background: var(--brown-mid); }
        .btn-logout { background: transparent; color: var(--red); border: 1.5px solid var(--red); }
        .btn-logout:hover { background: var(--red); color: white; }
        .btn-profile { background: transparent; color: var(--brown); border: 1.5px solid var(--border); }
        .btn-profile:hover { background: var(--border); }

        /* ── NOTIFICATION BELL (inside navbar, no overlap) ── */
        .notif-wrapper {
            position: relative;
            flex-shrink: 0;
        }
        .notif-bell-btn {
            position: relative;
            background: transparent;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--brown);
            transition: background 0.15s;
        }
        .notif-bell-btn:hover { background: var(--border); }
        .notif-bell-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--brown);
            flex-shrink: 0;
        }
        .notif-bell-btn .bell-label { font-size: 13px; }

        /* Badge dot — sits inside the button, top-right of the icon area */
        .notif-dot {
            position: absolute;
            top: 5px;
            right: 6px;
            width: 8px;
            height: 8px;
            background: #e05a2b;
            border-radius: 50%;
            border: 2px solid var(--surface);
            display: none;
        }
        .notif-dot.visible { display: block; }

        /* ── DROPDOWN PANEL ── */
        .notif-panel {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 280px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(74,50,32,0.14);
            z-index: 200;
        }
        .notif-panel.open { display: block; }

        .notif-panel-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notif-panel-header span {
            font-size: 13px;
            font-weight: 600;
            color: var(--brown);
        }
        .notif-clear-btn {
            font-size: 11px;
            color: var(--brown-lt);
            background: none;
            border: none;
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            transition: background 0.15s;
        }
        .notif-clear-btn:hover { background: #f0e8d8; color: var(--brown); }

        .notif-list { max-height: 260px; overflow-y: auto; }
        .notif-item {
            padding: 10px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            border-bottom: 1px solid rgba(232,201,154,0.4);
            transition: background 0.12s;
            cursor: pointer;
        }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: #faf4eb; }
        .notif-item-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e05a2b;
            margin-top: 5px;
            flex-shrink: 0;
        }
        .notif-item-dot.read { background: var(--brown-lt); }
        .notif-item-title { font-size: 13px; color: var(--brown); margin-bottom: 2px; }
        .notif-item-time  { font-size: 11px; color: var(--brown-lt); }

        .notif-empty {
            padding: 24px 14px;
            text-align: center;
            font-size: 13px;
            color: var(--brown-lt);
            font-style: italic;
        }

        /* ── MAIN ── */
        .main { max-width: 960px; margin: 0 auto; padding: 36px 24px 80px; }
        .welcome { margin-bottom: 32px; }
        .welcome h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 4px; }
        .welcome p { font-size: 13px; color: var(--brown-lt); }

        /* ── STATS ── */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 36px; }
        .stat-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 20px 24px; box-shadow: 0 2px 12px var(--shadow); text-align: center; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-icon   { font-size: 28px; margin-bottom: 8px; }
        .stat-number { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
        .stat-label  { font-size: 12px; color: var(--brown-lt); font-weight: 500; }

        /* ── TABS ── */
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 2px solid var(--border); }
        .tab-btn { background: none; border: none; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; color: var(--brown-lt); padding: 10px 20px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; border-radius: 0; }
        .tab-btn.active { color: var(--brown); border-bottom-color: var(--brown); }
        .tab-btn:hover { color: var(--brown); background: none; }

        /* ── GRID ── */
        .capsules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .capsule-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 20px; box-shadow: 0 3px 14px var(--shadow); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .capsule-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px var(--shadow); }
        .capsule-card.locked { background: #fdf8f0; border-color: #d4b896; }

        .capsule-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px; }
        .status-locked { background: #fef3e2; color: #a07030; border: 1px solid #f0d090; }
        .status-opened { background: #eaf5ee; color: var(--green); border: 1px solid #b0dfc0; }

        .capsule-thumb { width: 100%; height: 140px; border-radius: 10px; margin-bottom: 12px; background: #f0e8d8; display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--brown-lt); overflow: hidden; }
        .capsule-thumb img, .capsule-thumb video { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; }

        .capsule-message { font-size: 13px; color: var(--brown); line-height: 1.5; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .capsule-message.no-message { color: var(--brown-lt); font-style: italic; }

        .capsule-date      { font-size: 11px; color: var(--brown-lt); }
        .capsule-countdown { margin-top: 10px; font-size: 12px; color: #a07030; background: #fef3e2; border-radius: 8px; padding: 6px 10px; font-weight: 500; }

        .empty-state  { text-align: center; padding: 60px 20px; color: var(--brown-lt); }
        .empty-icon   { font-size: 48px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; color: var(--brown); margin-bottom: 8px; }
        .empty-state p  { font-size: 13px; line-height: 1.6; }
        .btn-create { display: inline-block; margin-top: 20px; padding: 12px 28px; background: var(--brown); color: white; border: none; border-radius: 12px; font-family: 'Poppins', sans-serif; font-size: 14px; cursor: pointer; text-decoration: none; transition: background 0.2s; }
        .btn-create:hover { background: var(--brown-mid); }

        .loading { text-align: center; padding: 60px; color: var(--brown-lt); font-size: 14px; }
        .spinner  { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--brown); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #music-btn { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 2px solid var(--border); border-radius: 50%; width: 48px; height: 48px; font-size: 20px; cursor: pointer; box-shadow: 0 4px 15px var(--shadow); z-index: 999; transition: transform 0.2s; display: flex; align-items: center; justify-content: center; }
        #music-btn:hover { transform: scale(1.1); }

        /* ── TABLET ── */
        @media (max-width: 768px) {
            .user-email { display: none; }
            .btn-nav { padding: 6px 12px; font-size: 12px; }
            .navbar-logo { font-size: 20px; }
            .bell-label { display: none; }
        }

        /* ── MOBILE ── */
        @media (max-width: 480px) {
            .navbar { height: 56px; padding: 0 12px; flex-wrap: nowrap; }
            .navbar-logo { font-size: 16px; letter-spacing: 2px; }
            .navbar-right { gap: 5px; flex-shrink: 0; }
            .user-email { display: none; }
            .btn-nav { padding: 5px 9px; font-size: 11px; }
            .btn-seal    { font-size: 11px; padding: 5px 10px; }
            .btn-profile { font-size: 11px; padding: 5px 9px; }
            .btn-logout  { font-size: 11px; padding: 5px 9px; }
            .bell-label  { display: none; }
            .notif-bell-btn { padding: 5px 8px; }
            .notif-panel { right: -10px; width: 260px; }

            .main { padding: 20px 12px 80px; }
            .welcome h1 { font-size: 22px; }
            .welcome p  { font-size: 12px; }
            .stats-row  { gap: 8px; }
            .stat-card  { padding: 12px 8px; border-radius: 12px; }
            .stat-icon  { font-size: 22px; margin-bottom: 4px; }
            .stat-number { font-size: 22px; }
            .stat-label  { font-size: 10px; }
            .tab-btn { padding: 8px 12px; font-size: 13px; }
            .capsules-grid { grid-template-columns: 1fr; }
            #music-btn { width: 40px; height: 40px; font-size: 16px; bottom: 16px; right: 16px; }
        }

        @media (max-width: 360px) {
            .navbar-logo { font-size: 16px; }
            .btn-nav { padding: 5px 8px; font-size: 10px; }
        }
    </style>
</head>
<body>

<audio id="capsuleMusic" loop>
    <source src="Joe Hisaishi - Nostalgia (Piano Solo).mp3" type="audio/mpeg">
</audio>
<button id="music-btn">🎵</button>

<nav class="navbar">
    <div class="navbar-logo">CAPSULE</div>
    <div class="navbar-right">
        <span class="user-email" id="userEmail">Loading...</span>
        <button class="btn-nav btn-seal" onclick="window.location.href='Capsuleinside.html'">+ Seal</button>
        <button class="btn-nav btn-profile" onclick="window.location.href='profile.html'">👤 Profile</button>

        <!-- ✅ NOTIFICATION BELL — inside navbar, dili mag-overlap -->
        <div class="notif-wrapper" id="notifWrapper">
            <button class="notif-bell-btn" id="notifBellBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="bell-label">Your Capsules</span>
                <span class="notif-dot" id="notifDot"></span>
            </button>

            <div class="notif-panel" id="notifPanel">
                <div class="notif-panel-header">
                    <span>Notifications</span>
                    <button class="notif-clear-btn" id="notifClearBtn">Clear all</button>
                </div>
                <div class="notif-list" id="notifList">
                    <div class="notif-empty">No notifications yet 🍌</div>
                </div>
            </div>
        </div>

        <button class="btn-nav btn-logout" id="logoutBtn">Sign Out</button>
    </div>
</nav>

<div class="main" id="pageContent" style="display:none;">
    <div class="welcome">
        <h1 id="welcomeText">My Capsules</h1>
        <p id="welcomeSub">Your sealed memories are waiting here.</p>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon">📦</div>
            <div class="stat-number" id="statTotal">0</div>
            <div class="stat-label">Total Capsules</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🔒</div>
            <div class="stat-number" id="statLocked">0</div>
            <div class="stat-label">Still Locked</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🎁</div>
            <div class="stat-number" id="statOpened">0</div>
            <div class="stat-label">Opened</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabLocked" onclick="switchTab('locked')">🔒 Locked</button>
        <button class="tab-btn" id="tabOpened" onclick="switchTab('opened')">🎁 Opened</button>
    </div>

    <div id="capsulesContainer">
        <div class="loading">
            <div class="spinner"></div>
            Loading your capsules...
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut }
        from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
    import { supabase } from './supabase.js';
    import { init as initNotifs } from './notifications.js';

    const firebaseConfig = {
        apiKey: "AIzaSyBtKdC5Po01JvwfC33AywIZKDZ-4-6SH9Y",
        authDomain: "capsule-d556e.firebaseapp.com",
        projectId: "capsule-d556e",
        storageBucket: "capsule-d556e.firebasestorage.app",
        messagingSenderId: "667845284113",
        appId: "1:667845284113:web:cf11b1d4b7ef99eb83fcb0",
        databaseURL: "https://capsule-d556e-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let allCapsules = [];
    let currentTab  = 'locked';

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'examplesignin.html'; return; }

        document.getElementById('pageContent').style.display = 'block';
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('welcomeText').textContent = 'Welcome back 👋';
        document.getElementById('welcomeSub').textContent = 'Here are all your sealed memories, ' + user.email;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('refresh')) window.history.replaceState({}, '', 'dashboard.html');

        await loadAllCapsules(user.uid);
        loadNotifications(user.uid);
        initNotifs(user.uid);
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = 'examplesignin.html';
    });

    // ══════════════════════════════════════════
    // NOTIFICATION BELL LOGIC
    // ══════════════════════════════════════════
    let notifOpen = false;

    document.getElementById('notifBellBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        notifOpen = !notifOpen;
        document.getElementById('notifPanel').classList.toggle('open', notifOpen);
    });

    document.addEventListener('click', (e) => {
        if (!document.getElementById('notifWrapper').contains(e.target)) {
            notifOpen = false;
            document.getElementById('notifPanel').classList.remove('open');
        }
    });

    document.getElementById('notifClearBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('notifList').innerHTML = '<div class="notif-empty">No notifications yet 🍌</div>';
        document.getElementById('notifDot').classList.remove('visible');
    });

    async function loadNotifications(userId) {
        // Kuhaon ang mga capsule nga bag-o lang nabuksan (within last 24 hours)
        const { data, error } = await supabase
            .from('memories')
            .select('id, message, open_date')
            .eq('user_id', userId)
            .lte('open_date', new Date().toISOString())
            .gte('open_date', new Date(Date.now() - 86400000).toISOString())
            .order('open_date', { ascending: false });

        if (error || !data || data.length === 0) return;

        const list = document.getElementById('notifList');
        list.innerHTML = '';
        document.getElementById('notifDot').classList.add('visible');

        data.forEach(capsule => {
            const item = document.createElement('div');
            item.className = 'notif-item';

            const timeAgo = getTimeAgo(new Date(capsule.open_date));
            const preview = capsule.message
                ? capsule.message.substring(0, 40) + (capsule.message.length > 40 ? '...' : '')
                : 'Your capsule is now open!';

            item.innerHTML = `
                <div class="notif-item-dot"></div>
                <div>
                    <div class="notif-item-title">🎁 A capsule just opened!</div>
                    <div class="notif-item-time">${preview}</div>
                    <div class="notif-item-time">${timeAgo}</div>
                </div>
            `;
            item.addEventListener('click', () => {
                window.location.href = 'capsule-detail.html?id=' + capsule.id;
            });
            list.appendChild(item);
        });
    }

    function getTimeAgo(date) {
        const diff = Date.now() - date.getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 1)  return 'Just now';
        if (mins < 60) return mins + ' min ago';
        const hrs = Math.floor(mins / 60);
        if (hrs < 24)  return hrs + ' hr ago';
        return Math.floor(hrs / 24) + ' day(s) ago';
    }

    // ══════════════════════════════════════════
    // CAPSULE LOADING
    // ══════════════════════════════════════════
    async function loadAllCapsules(userId) {
        const { data, error } = await supabase
            .from('memories')
            .select('*')
            .eq('user_id', userId)
            .order('open_date', { ascending: false });

        if (error) {
            document.getElementById('capsulesContainer').innerHTML =
                '<div class="empty-state"><div class="empty-icon">⚠️</div>' +
                '<h3>Could not load capsules</h3>' +
                '<p>Please check your connection and try again.</p></div>';
            return;
        }

        allCapsules = data || [];
        const now    = new Date();
        const locked = allCapsules.filter(c => new Date(c.open_date) > now);
        const opened = allCapsules.filter(c => new Date(c.open_date) <= now);

        document.getElementById('statTotal').textContent  = allCapsules.length;
        document.getElementById('statLocked').textContent = locked.length;
        document.getElementById('statOpened').textContent = opened.length;

        renderTab(currentTab);
    }

    window.switchTab = function(tab) {
        currentTab = tab;
        document.getElementById('tabLocked').classList.toggle('active', tab === 'locked');
        document.getElementById('tabOpened').classList.toggle('active', tab === 'opened');
        renderTab(tab);
    };

    function renderTab(tab) {
        const now      = new Date();
        const filtered = tab === 'locked'
            ? allCapsules.filter(c => new Date(c.open_date) > now)
            : allCapsules.filter(c => new Date(c.open_date) <= now);

        const container = document.getElementById('capsulesContainer');

        if (filtered.length === 0) {
            container.innerHTML = tab === 'locked'
                ? '<div class="empty-state"><div class="empty-icon">🔒</div>' +
                  '<h3>No locked capsules</h3><p>Seal a new memory and set a future date!</p>' +
                  '<a href="Capsuleinside.html" class="btn-create">+ Seal a Memory</a></div>'
                : '<div class="empty-state"><div class="empty-icon">🎁</div>' +
                  '<h3>No opened capsules yet</h3>' +
                  '<p>Your capsules will appear here when their date arrives.</p></div>';
            return;
        }

        const grid = document.createElement('div');
        grid.className = 'capsules-grid';
        filtered.forEach(c => grid.appendChild(buildCard(c, tab, now)));
        container.innerHTML = '';
        container.appendChild(grid);
    }

    function buildCard(capsule, tab, now) {
        const card = document.createElement('div');
        card.className = 'capsule-card' + (tab === 'locked' ? ' locked' : '');

        const badge = tab === 'locked'
            ? '<span class="capsule-status status-locked">🔒 Sealed</span>'
            : '<span class="capsule-status status-opened">🎁 Opened</span>';

        let thumbHTML = '<div class="capsule-thumb">📦</div>';
        if (capsule.file_url) {
            const isVideo = /\.(mp4|mov|webm|avi)$/i.test(capsule.file_url);
            if (tab === 'locked') {
                thumbHTML = '<div class="capsule-thumb">🔒</div>';
            } else if (isVideo) {
                thumbHTML = '<div class="capsule-thumb"><video src="' + capsule.file_url + '"></video></div>';
            } else {
                thumbHTML = '<div class="capsule-thumb"><img src="' + capsule.file_url + '" alt="Memory"></div>';
            }
        } else if (capsule.message) {
            thumbHTML = '<div class="capsule-thumb">📝</div>';
        }

        const msgText = tab === 'locked' ? '🔒 Hidden until open date...' : (capsule.message || '');
        const msgHTML = capsule.message
            ? '<div class="capsule-message">' + msgText + '</div>'
            : '<div class="capsule-message no-message">No message</div>';

        const openDateLabel = new Date(capsule.open_date).toLocaleDateString('en-PH', {
            year: 'numeric', month: 'short', day: 'numeric',
            timeZone: 'Asia/Manila'
        });

        let countdownHTML = '';
        if (tab === 'locked') {
            const diff    = new Date(capsule.open_date) - now;
            const days    = Math.floor(diff / 86400000);
            const hours   = Math.floor((diff % 86400000) / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const txt = days > 0
                ? 'Opens in ' + days + ' day' + (days > 1 ? 's' : '')
                : hours > 0
                    ? 'Opens in ' + hours + ' hour' + (hours > 1 ? 's' : '')
                    : minutes > 0
                        ? 'Opens in ' + minutes + ' minute' + (minutes > 1 ? 's' : '')
                        : 'Opening soon...';
            countdownHTML = '<div class="capsule-countdown">⏳ ' + txt + '</div>';
        }

        card.innerHTML = badge + thumbHTML + msgHTML +
            '<div class="capsule-date">📅 Opens: ' + openDateLabel + '</div>' +
            countdownHTML;

        card.addEventListener('click', () => {
            window.location.href = 'capsule-detail.html?id=' + capsule.id;
        });

        return card;
    }

    // ── MUSIC ──
    const music    = document.getElementById('capsuleMusic');
    const musicBtn = document.getElementById('music-btn');
    let isPlaying  = false;

    function startMusic() {
        music.play().then(() => {
            isPlaying = true;
            musicBtn.textContent = '🎵';
    }).catch(() => {
            isPlaying = false;
            musicBtn.textContent = '🔇';
    });
}


startMusic();


function onFirstInteraction() {
    if (!isPlaying) {
        music.play().then(() => {
            isPlaying = true;
            musicBtn.textContent = '🎵';
        });
    }
    document.removeEventListener('click', onFirstInteraction);
    document.removeEventListener('touchstart', onFirstInteraction);
}
document.addEventListener('click', onFirstInteraction);
document.addEventListener('touchstart', onFirstInteraction);

// Manual toggle ni user
musicBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // important kaayo ni!
    if (isPlaying) {
        music.pause();
        isPlaying = false;
        musicBtn.textContent = '🔇';
    } else {
        music.play();
        isPlaying = true;
        musicBtn.textContent = '🎵';
    }
});

</script>

</body>
</html>
